name: Actualizar catálogo desde INVIMA

on:
  workflow_dispatch:
  schedule:
    # 18:30 de Colombia, de lunes a viernes.
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-catalogo
  cancel-in-progress: false

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTAS_INDEX_START_YEAR: "2013"
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Consultar la página oficial y actualizar el registro
        run: python sync_catalog.py

      - name: Verificar catálogo y manifiesto
        run: >-
          python -m unittest
          tests.test_catalog
          tests.test_manifest
          -v

      - name: Guardar cambios del catálogo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actas_catalog.csv documents_manifest.csv data/catalog-report.json
          if git diff --cached --quiet; then
            echo "No se encontraron nuevas publicaciones."
          else
            git commit -m "Actualizar catálogo oficial de actas"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
