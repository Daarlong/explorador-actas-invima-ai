name: Construir índice

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Construir base de búsqueda
        run: python build_index.py

      - name: Verificar tamaño del índice
        shell: bash
        run: |
          bytes=$(stat -c%s data/actas.db)
          echo "Tamaño de actas.db: $((bytes / 1024 / 1024)) MiB"
          if [ "$bytes" -ge 104857600 ]; then
            echo "::error::actas.db supera el límite de 100 MiB de GitHub."
            exit 1
          fi

      - name: Guardar índice en el repositorio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actas.db

          if git diff --cached --quiet; then
            echo "El índice no cambió."
          else
            git commit -m "Actualizar índice de actas"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publicar respaldo
        uses: actions/upload-artifact@v7
        with:
          name: actas-db
          path: data/actas.db
          if-no-files-found: error
          retention-days: 7
