name: Construir índice

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construir-indice
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ACTAS_DISABLE_DATABASE_PACKAGE: "1"
      ACTAS_DATABASE_PATH: data/actas.db
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt

      - name: Verificar catálogo y código
        run: python -m unittest discover -v

      - name: Construir base de búsqueda
        run: python build_index.py

      - name: Comprimir y dividir el índice
        shell: bash
        run: |
          rm -f data/actas.db.gz data/actas.db.gz.part-*
          gzip -9 -c data/actas.db > data/actas.db.gz
          split -b 90m -d -a 3 data/actas.db.gz data/actas.db.gz.part-
          rm data/actas.db.gz data/actas.db

      - name: Guardar índice en el repositorio privado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data
          git add -f data/actas.db.gz.part-*
          if git diff --cached --quiet; then
            echo "El índice no cambió."
          else
            git commit -m "Actualizar índice de actas 2020-2026"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
